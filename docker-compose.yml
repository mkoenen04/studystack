services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: studystack
      POSTGRES_PASSWORD: studystack
      POSTGRES_DB: studystack
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U studystack"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      DATABASE_URL: postgresql://studystack:studystack@db:5432/studystack
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata: