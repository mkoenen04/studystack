<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StudyStack</title>
  <style>
    table { border-collapse: collapse; margin-top: 8px; }
    th, td { border: 1px solid #999; padding: 6px 12px; text-align: left; }
    form div { margin-bottom: 8px; }
  </style>
</head>
<body>
  <h1>StudyStack</h1>
  <p>Study planner that tracks assignments and suggests a weekly schedule.</p>

  <!-- Shown when logged out -->
  <div id="logged-out-view">
    <h2>Log in</h2>
    <form id="login-form">
      <div>
        <label for="login-email">Email</label><br>
        <input type="text" id="login-email" autocomplete="email">
      </div>
      <div>
        <label for="login-password">Password</label><br>
        <input type="password" id="login-password" autocomplete="current-password">
      </div>
      <button type="submit">Log in</button>
    </form>
    <p id="login-message"></p>

    <h2>Create an account</h2>
    <form id="register-form">
      <div>
        <label for="email">Email</label><br>
        <input type="text" id="email" name="email" autocomplete="email">
      </div>
      <div>
        <label for="password">Password (8 to 72 characters)</label><br>
        <input type="password" id="password" name="password" autocomplete="new-password">
      </div>
      <div>
        <label for="confirm-password">Confirm password</label><br>
        <input type="password" id="confirm-password" name="confirm-password" autocomplete="new-password">
      </div>
      <button type="submit">Register</button>
    </form>
    <p id="register-message"></p>
  </div>

  <!-- Shown when logged in -->
  <div id="logged-in-view" hidden>
    <h2>Welcome</h2>
    <p>Logged in as <strong id="user-email"></strong></p>
    <button id="logout-button">Log out</button>

    <!-- *** NEW *** -->
    <h2>Add a course</h2>
    <form id="course-form">
      <div>
        <label for="course-name">Course name</label><br>
        <input type="text" id="course-name" placeholder="e.g. Intro to Programming">
      </div>
      <button type="submit">Add course</button>
    </form>
    <p id="course-message"></p>

    <!-- *** NEW *** -->
    <h2>Add an assignment</h2>
    <form id="assignment-form">
      <div>
        <label for="assignment-course">Course</label><br>
        <select id="assignment-course"></select>
      </div>
      <div>
        <label for="assignment-title">Title</label><br>
        <input type="text" id="assignment-title" placeholder="e.g. Homework 1">
      </div>
      <div>
        <label for="assignment-due">Due date</label><br>
        <input type="date" id="assignment-due">
      </div>
      <div>
        <label for="assignment-hours">Estimated hours</label><br>
        <input type="number" id="assignment-hours" min="0" max="100" step="any">
      </div>
      <button type="submit">Add assignment</button>
    </form>
    <p id="assignment-message"></p>

    <!-- *** NEW *** -->
    <h2>Your assignments</h2>
    <p id="assignment-empty">No assignments yet.</p>
    <table id="assignment-table" hidden>
      <thead>
        <tr>
          <th>Title</th>
          <th>Course</th>
          <th>Due</th>
          <th>Estimated hours</th>
        </tr>
      </thead>
      <tbody id="assignment-rows"></tbody>
    </table>
  </div>

  <hr>
  <button id="check-api">Check API connection</button>
  <p id="api-status">Not checked yet.</p>

  <script src="js/app.js"></script>
</body>
</html>
